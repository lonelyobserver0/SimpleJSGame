<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multiplayer FPS</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="hud">
  <div>Stato: <span id="status">disconnected</span></div>
  <div>Ping: <span id="ping">0</span> ms</div>
  <div id="weapon-info">
    <div id="hud_weapon">Arma: NESSUNA</div>
    <div id="hud_ammo">Munizioni: 0</div>
  </div>
  <div id="health-bar">
    <div id="health-fill" style="width: 100%"></div>
  </div>
  <div>Vita: <span id="health-text">100</span>/100</div>
  <div id="kill-feed"></div>
  <button id="btnConnect">Connetti</button>
</div>

<div id="crosshair">
  <div class="crosshair-line crosshair-h"></div>
  <div class="crosshair-line crosshair-v"></div>
</div>

<div id="instructions">
  <h3>Multiplayer FPS</h3>
  <p>Clicca per iniziare</p>
  <p><strong>Controlli:</strong></p>
  <p>WASD - Movimento</p>
  <p>Mouse - Guarda intorno</p>
  <p>Click sinistro - Spara</p>
  <p>E - Raccogli arma</p>
  <p>Shift - Corri</p>
  <p>Ctrl - Accucciati</p>
</div>

<!-- Three.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
console.log("🚀 Multiplayer FPS Loading...");

// ============= GLOBAL VARIABLES =============
let ws = null;
let myId = null;
let scene, camera, renderer;
let players = {};
let weapons = {};
let targets = {};
let tracers = [];
let isLocked = false;
let lastInputSent = 0;
let lastFrame = performance.now();

const sensitivity = 0.002;

// Local player state
const localPlayer = {
  x: 0, y: 1.0, z: 0, 
  yaw: 0, pitch: 0,
  keys: {},
  serverKeys: {},
  velocity: {x:0, z:0},
  weapon: null,
  ammo: 0,
  health: 100,
  
  update(dt) {
    // Movement calculation
    let dx = 0, dz = 0;
    const yaw = this.yaw;
    const forward = {x: Math.sin(yaw), z: Math.cos(yaw)};
    const right = {x: Math.sin(yaw + Math.PI/2), z: Math.cos(yaw + Math.PI/2)};
    
    if(this.keys.forward) { dx += forward.x; dz += forward.z; }
    if(this.keys.backward){ dx -= forward.x; dz -= forward.z; }
    if(this.keys.left){ dx -= right.x; dz -= right.z; }
    if(this.keys.right){ dx += right.x; dz += right.z; }

    let baseSpeed = 5.0;
    if(this.keys.run) baseSpeed *= 1.8;
    if(this.keys.crouch) baseSpeed *= 0.5;

    const L = Math.hypot(dx, dz);
    if(L > 0){ dx = dx/L * baseSpeed; dz = dz/L * baseSpeed; }

    const accel = 15.0, decel = 12.0;
    this.velocity.x = THREE.MathUtils.lerp(this.velocity.x, dx, dt * (L > 0 ? accel : decel));
    this.velocity.z = THREE.MathUtils.lerp(this.velocity.z, dz, dt * (L > 0 ? accel : decel));
    
    this.x += this.velocity.x * dt; 
    this.z += this.velocity.z * dt;
    this.y = THREE.MathUtils.lerp(this.y, this.keys.crouch ? 0.7 : 1.0, dt * 8);

    // Update camera
    camera.position.set(this.x, this.y + 0.6, this.z);
    camera.rotation.set(this.pitch, this.yaw, 0, 'YXZ');
    
    // Convert keys for server
    this.serverKeys = {
      w: this.keys.forward || false,
      s: this.keys.backward || false, 
      a: this.keys.left || false,
      d: this.keys.right || false,
      shift: this.keys.run || false,
      ctrl: this.keys.crouch || false
    };
    
    // Send input to server
    const now = performance.now();
    if(ws && ws.readyState === WebSocket.OPEN && now - lastInputSent > 50) {
      ws.send(JSON.stringify({
        type: "input",
        input: {
          yaw: this.yaw,
          pitch: this.pitch,
          keys: this.serverKeys
        }
      }));
      lastInputSent = now;
    }
  },
  
  takeDamage() {
    // Visual damage effect
    document.body.style.boxShadow = 'inset 0 0 50px rgba(255,0,0,0.5)';
    setTimeout(() => {
      document.body.style.boxShadow = 'none';
    }, 200);
  }
};

// ============= PLAYER CLASS =============
class Player {
  constructor(id, x=0, y=1, z=0) {
    this.id = id;
    this.x = x; this.y = y; this.z = z;
    this.yaw = 0; this.pitch = 0;
    this.health = 100;
    this.weapon = null;
    this.ammo = 0;

    // Create mesh
    const geometry = new THREE.CapsuleGeometry(0.3, 1.0, 4, 8);
    const material = new THREE.MeshStandardMaterial({ 
      color: id === myId ? 0x0000ff : 0x00ff00 
    });
    this.mesh = new THREE.Mesh(geometry, material);
    this.mesh.castShadow = true;
    this.mesh.position.set(this.x, this.y, this.z);
    scene.add(this.mesh);
    
    players[id] = this;
    console.log(`👤 Player ${id} created`);
  }

  update(dt) {
    this.mesh.position.set(this.x, this.y, this.z);
    this.mesh.rotation.y = this.yaw;
  }

  remove() {
    scene.remove(this.mesh);
    delete players[this.id];
    console.log(`👤 Player ${this.id} removed`);
  }
}

// ============= WEAPON CLASS =============
class Weapon {
  constructor(id, type, x, y, z, ammo=30) {
    this.id = id; 
    this.type = type; 
    this.x = x; this.y = y; this.z = z; 
    this.ammo = ammo;

    const geometry = new THREE.BoxGeometry(0.3, 0.2, 0.7);
    const material = new THREE.MeshStandardMaterial({ color: 0xffaa00 });
    this.mesh = new THREE.Mesh(geometry, material);
    this.mesh.position.set(x, y, z);
    this.mesh.castShadow = true;
    
    this.rotationSpeed = Math.random() * 0.02 + 0.01;
    this.baseY = y;
    
    scene.add(this.mesh);
    weapons[id] = this;
    console.log(`🔫 Weapon ${type} spawned at (${x}, ${y}, ${z})`);
  }

  update(dt) {
    this.mesh.rotation.y += this.rotationSpeed;
    this.mesh.position.y = this.baseY + Math.sin(Date.now() * 0.003) * 0.1;
  }

  remove() {
    scene.remove(this.mesh);
    delete weapons[this.id];
    console.log(`🔫 Weapon ${this.id} removed`);
  }
}

// ============= PROJECTILE SYSTEM =============
function spawnTracer(x, y, z, dir) {
  const geometry = new THREE.CylinderGeometry(0.02, 0.02, 0.5, 6);
  const material = new THREE.MeshBasicMaterial({ color: 0xffff00 });
  const tracer = new THREE.Mesh(geometry, material);
  tracer.position.set(x + dir.x * 0.5, y + 0.2, z + dir.z * 0.5);
  tracer.rotation.x = Math.PI / 2;
  scene.add(tracer);
  tracers.push({mesh: tracer, dir: dir, life: 0.3});
}

function createMuzzleFlash() {
  const geometry = new THREE.SphereGeometry(0.1, 6, 6);
  const material = new THREE.MeshBasicMaterial({ color: 0xffaa00 });
  const flash = new THREE.Mesh(geometry, material);
  flash.position.copy(camera.position);
  flash.position.add(camera.getWorldDirection(new THREE.Vector3()).multiplyScalar(0.5));
  scene.add(flash);
  setTimeout(() => scene.remove(flash), 50);
}

function updateProjectiles(dt) {
  for(let i = tracers.length - 1; i >= 0; i--) {
    const t = tracers[i];
    t.mesh.position.x += t.dir.x * dt * 50;
    t.mesh.position.y += t.dir.y * dt * 50;
    t.mesh.position.z += t.dir.z * dt * 50;
    t.life -= dt;
    
    if(t.life <= 0) {
      scene.remove(t.mesh);
      tracers.splice(i, 1);
    }
  }
}

// ============= SCENE INITIALIZATION =============
function initScene() {
  console.log("🎮 Initializing 3D scene...");
  
  scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0x333333, 50, 200);

  camera = new THREE.PerspectiveCamera(90, innerWidth/innerHeight, 0.1, 1000);
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);

  window.addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  // Lights
  const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
  dirLight.position.set(10, 20, 10);
  dirLight.castShadow = true;
  dirLight.shadow.mapSize.width = 2048;
  dirLight.shadow.mapSize.height = 2048;
  scene.add(dirLight);

  const ambLight = new THREE.AmbientLight(0x404040, 0.3);
  scene.add(ambLight);

  // Floor
  const floorGeometry = new THREE.PlaneGeometry(200, 200, 20, 20);
  const floorMaterial = new THREE.MeshStandardMaterial({ 
    color: 0x444444, 
    roughness: 0.8, 
    metalness: 0.1 
  });
  const floor = new THREE.Mesh(floorGeometry, floorMaterial);
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = 0;
  floor.receiveShadow = true;
  scene.add(floor);

  // Environment walls
  const wallMaterial = new THREE.MeshStandardMaterial({ color: 0x666666 });
  
  const wall1 = new THREE.Mesh(new THREE.BoxGeometry(20, 4, 1), wallMaterial);
  wall1.position.set(0, 2, -15);
  wall1.castShadow = true;
  wall1.receiveShadow = true;
  scene.add(wall1);
  
  const wall2 = new THREE.Mesh(new THREE.BoxGeometry(1, 4, 20), wallMaterial);
  wall2.position.set(-15, 2, 0);
  wall2.castShadow = true;
  wall2.receiveShadow = true;
  scene.add(wall2);
  
  const wall3 = new THREE.Mesh(new THREE.BoxGeometry(1, 4, 20), wallMaterial);
  wall3.position.set(15, 2, 0);
  wall3.castShadow = true;
  wall3.receiveShadow = true;
  scene.add(wall3);
}

// ============= NETWORK =============
function connect() {
  console.log("🌐 Connecting to server...");
  
  const statusEl = document.getElementById('status');
  const btnConnect = document.getElementById('btnConnect');
  
  if(ws && ws.readyState === WebSocket.OPEN) {
    console.log("🔴 Disconnecting...");
    ws.close();
    return;
  }

  ws = new WebSocket("ws://localhost:8765");

  ws.onopen = () => {
    console.log("✅ Connected to server!");
    statusEl.textContent = "connected";
    btnConnect.textContent = "Disconnetti";
    ws.send(JSON.stringify({ name: "Player" + Math.floor(Math.random()*1000) }));
  };

  ws.onerror = (error) => {
    console.error("❌ WebSocket error:", error);
    statusEl.textContent = "error";
  };

  ws.onclose = (event) => {
    console.log("🔴 Connection closed:", event.code, event.reason);
    statusEl.textContent = "disconnected";
    btnConnect.textContent = "Connetti";
  };

  ws.onmessage = (event) => {
    const msg = JSON.parse(event.data);
    handleServerMessage(msg);
  };
}

function handleServerMessage(msg) {
  // console.log("📨", msg.type, msg);
  
  switch(msg.type) {
    case "welcome":
      myId = msg.id;
      console.log("🎯 My ID:", myId);
      break;
      
    case "state":
      // Update players
      if(msg.players) {
        msg.players.forEach(p => {
          if(!players[p.id]) new Player(p.id);
          
          // Sync local player from server (with prediction)
          if(p.id === myId) {
            const dx = Math.abs(localPlayer.x - p.x);
            const dz = Math.abs(localPlayer.z - p.z);
            if(dx > 2 || dz > 2) {
              localPlayer.x = p.x;
              localPlayer.z = p.z;
            }
            localPlayer.health = p.health;
            localPlayer.weapon = p.weapon;
            localPlayer.ammo = p.ammo || 0;
            
            // Update HUD
            document.getElementById('health-text').textContent = localPlayer.health;
            document.getElementById('health-fill').style.width = localPlayer.health + '%';
            if(p.weapon) {
              document.getElementById('hud_weapon').innerText = `Arma: ${p.weapon.toUpperCase()}`;
              document.getElementById('hud_ammo').innerText = `Munizioni: ${localPlayer.ammo}`;
            }
          }
          
          Object.assign(players[p.id], p);
        });

        // Remove disconnected players
        const activeIds = new Set(msg.players.map(p => p.id));
        Object.keys(players).forEach(id => {
          if(!activeIds.has(id)) {
            players[id].remove();
          }
        });
      }

      // Update weapons
      if(msg.weapons) {
        msg.weapons.forEach(w => {
          if(!weapons[w.id]) {
            new Weapon(w.id, w.type, w.x, w.y, w.z);
          } else {
            weapons[w.id].mesh.position.set(w.x, w.y, w.z);
          }
        });
      }
      break;
      
    case "weapon_pickup":
      localPlayer.weapon = msg.weapon;
      localPlayer.ammo = msg.ammo;
      document.getElementById('hud_weapon').innerText = `Arma: ${msg.weapon.toUpperCase()}`;
      document.getElementById('hud_ammo').innerText = `Munizioni: ${msg.ammo}`;
      console.log(`🔫 Picked up: ${msg.weapon} with ${msg.ammo} ammo`);
      break;
      
    case "weapon_spawn":
      console.log("🔫 New weapon spawned:", msg.type);
      if(!weapons[msg.id]) {
        new Weapon(msg.id, msg.type, msg.x, msg.y, msg.z);
      }
      break;
      
    case "weapon_remove":
      if(weapons[msg.id]) {
        weapons[msg.id].remove();
      }
      break;
      
    case "got_hit":
      console.log(`💥 Hit by ${msg.by}! Health: ${msg.health}`);
      localPlayer.takeDamage();
      localPlayer.health = msg.health;
      break;
      
    case "hit":
      console.log(`🎯 You hit ${msg.target}! Their health: ${msg.health}`);
      break;
      
    case "kill":
      console.log(`☠️ ${msg.killer} killed ${msg.victim}`);
      const killFeed = document.getElementById('kill-feed');
      if(killFeed) {
        const killMsg = document.createElement('div');
        killMsg.textContent = `${msg.killer} → ${msg.victim}`;
        killMsg.style.color = msg.killer === myId ? '#00ff00' : '#ff4444';
        killMsg.style.fontSize = '12px';
        killMsg.style.marginBottom = '2px';
        killFeed.appendChild(killMsg);
        setTimeout(() => killMsg.remove(), 5000);
      }
      break;
      
    case "join":
      console.log(`👋 ${msg.id} joined the game`);
      break;
      
    case "leave":
      console.log(`👋 ${msg.id} left the game`);
      break;
  }
}

// ============= CONTROLS =============
function setupControls() {
  const btnConnect = document.getElementById('btnConnect');
  const instructions = document.getElementById('instructions');
  
  console.log("🎮 Setting up controls...");
  
  // Connect button
  btnConnect.addEventListener('click', () => {
    console.log("🔘 Connect button clicked!");
    connect();
  });
  
  // Pointer lock
  renderer.domElement.addEventListener('click', () => {
    renderer.domElement.requestPointerLock();
    instructions.style.display = 'none';
  });
  
  document.addEventListener('pointerlockchange', () => {
    isLocked = (document.pointerLockElement === renderer.domElement);
    document.getElementById('crosshair').style.display = isLocked ? 'block' : 'none';
    instructions.style.display = isLocked ? 'none' : 'block';
  });
  
  // Mouse movement
  document.addEventListener('mousemove', e => {
    if(!isLocked) return;
    localPlayer.yaw -= e.movementX * sensitivity;
    localPlayer.pitch -= e.movementY * sensitivity;
    localPlayer.pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, localPlayer.pitch));
  });

  // Keyboard
  const keyMap = {
    'KeyW': 'forward',
    'KeyA': 'left',
    'KeyS': 'backward',
    'KeyD': 'right',
    'ShiftLeft': 'run',
    'ControlLeft': 'crouch',
    'KeyE': 'interact'
  };
  
  window.addEventListener('keydown', e => {
    const action = keyMap[e.code]; 
    if(action){ 
      localPlayer.keys[action] = true; 
      e.preventDefault(); 
    }
  });
  
  window.addEventListener('keyup', e => {
    const action = keyMap[e.code]; 
    if(action){ 
      localPlayer.keys[action] = false; 
      e.preventDefault(); 
    }
  });

  // Mouse shooting
  renderer.domElement.addEventListener('mousedown', e => {
    if(e.button !== 0 || !isLocked) return;
    
    const dir = {
      x: Math.sin(localPlayer.yaw), 
      y: -Math.sin(localPlayer.pitch), 
      z: Math.cos(localPlayer.yaw)
    };
    
    if(ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: "shoot", dir }));
    }
    
    createMuzzleFlash();
    spawnTracer(localPlayer.x, localPlayer.y + 0.6, localPlayer.z, dir);
    
    // Update ammo display
    if(localPlayer.ammo > 0) {
      localPlayer.ammo--;
      document.getElementById('hud_ammo').innerText = `Munizioni: ${localPlayer.ammo}`;
    }
  });

  // Weapon pickup
  window.addEventListener('keydown', e => {
    if(e.code === 'KeyE' && isLocked) {
      Object.values(weapons).forEach(w => {
        const dist = Math.hypot(localPlayer.x - w.x, localPlayer.z - w.z);
        if(dist < 2.0 && ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({type: "pickup", id: w.id}));
        }
      });
    }
  });
}

// ============= GAME LOOP =============
function animate() {
  requestAnimationFrame(animate);
  
  const now = performance.now();
  const dt = Math.min((now - lastFrame) / 1000, 1/30);
  lastFrame = now;

  // Update local player
  localPlayer.update(dt);

  // Update other players
  Object.values(players).forEach(player => {
    player.update(dt);
  });

  // Update weapons
  Object.values(weapons).forEach(weapon => {
    weapon.update(dt);
  });

  // Update projectiles
  updateProjectiles(dt);

  renderer.render(scene, camera);
}

// ============= INITIALIZATION =============
document.addEventListener('DOMContentLoaded', () => {
  console.log("📄 DOM loaded!");
  initScene();
  setupControls();
  animate();
  console.log("🚀 Multiplayer FPS initialized!");
  console.log("💡 Click 'Connetti' to join the server!");
});
</script>

</body>
</html>
