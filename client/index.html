<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multiplayer FPS</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="hud">
  <div>Stato: <span id="status">disconnected</span></div>
  <div>Ping: <span id="ping">0</span> ms</div>
  <button id="btnConnect">Connetti</button>
</div>

<script type="module">
  import { connect, ws } from './js/network.js';
  import './js/main.js';  // Inizializza scene, camera, animate loop

  const statusEl = document.getElementById('status');
  const pingEl = document.getElementById('ping');
  const btnConnect = document.getElementById('btnConnect');

  const SERVER = "ws://0.0.0.0:8765"; // Modifica con l'IP del server reale

  btnConnect.addEventListener('click', () => {
    if(ws && ws.readyState === WebSocket.OPEN){
      ws.close();
    } else {
      connect(SERVER, statusEl, pingEl, btnConnect, window.local);
    }
  });
</script>

</body>
</html>
